<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Parent Signup - Aacharya V6</title><link rel="icon" href="/aacharya-app-icon.png" type="image/png"><link rel="apple-touch-icon" href="/aacharya-app-icon.png"><link rel="stylesheet" href="/parent-portal.css"></head><body><div class="shell"><div class="auth-wrap"><div class="auth-card"><div class="brand-wrap"><img class="brand-logo" src="/aacharya-app-icon.png" alt="Aacharya"><div class="brand"><h1>AACHARYA LEARNING ACADEMY</h1><p>V6 Parent Portal Invitation</p></div></div><div id="inviteInfo" class="row" style="margin:16px 0">Checking invitation…</div><form id="signupForm" class="form-grid hidden"><label><span>Parent / Guardian Name</span><input name="full_name" required></label><label><span>Email</span><input name="email" type="email" required></label><label><span>Phone</span><input name="phone" type="tel"></label><label><span>Relationship</span><input name="relationship" value="Parent / Guardian"></label><label><span>Create Password</span><input name="password" type="password" minlength="8" required></label><label><span>Confirm Password</span><input name="confirm" type="password" minlength="8" required></label><button class="btn primary">Create Parent Account</button></form><div id="msg" class="muted" style="margin-top:12px"></div><div class="divider"></div><a href="/parent">Already have an account? Parent Login</a></div></div></div><script src="/parent-signup.js"></script></body></html>
