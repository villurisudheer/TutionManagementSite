services:
  - type: web
    name: aacharya-tuition-manager-v6
    runtime: node
    rootDir: aacharya-student-intake-render-v6
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_NAME
        value: Aacharya Sudheer
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SYNC_KEY
        generateValue: true
      - key: PARENT_SESSION_SECRET
        generateValue: true
      - key: INVITE_VALID_DAYS
        value: 7
      - key: COURSE_GRACE_DAYS
        value: 7
      - key: CREDENTIAL_PURGE_DAYS
        value: 30
      - key: MAX_PROOF_BYTES
        value: 5242880
    disk:
      name: aacharya-data
      mountPath: /var/data
      sizeGB: 1
