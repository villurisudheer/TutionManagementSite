services:
  - type: web
    name: aacharya-tuition-manager
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_NAME
        value: Aacharya Sudheer
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SYNC_KEY
        generateValue: true
      - key: PARENT_PORTAL_URL
        fromService:
          name: aacharya-parent-portal
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PARENT_PORTAL_SECRET
        fromService:
          name: aacharya-parent-portal
          type: web
          envVarKey: PARENT_PORTAL_SECRET
    disk:
      name: aacharya-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: aacharya-parent-portal
    runtime: node
    rootDir: parent-portal-extension
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_BASE_URL
        fromService:
          name: aacharya-parent-portal
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: EXTENSION_ADMIN_NAME
        value: Aacharya Sudheer
      - key: EXTENSION_ADMIN_EMAIL
        fromService:
          name: aacharya-tuition-manager
          type: web
          envVarKey: ADMIN_EMAIL
      - key: EXTENSION_ADMIN_PASSWORD
        fromService:
          name: aacharya-tuition-manager
          type: web
          envVarKey: ADMIN_PASSWORD
      - key: EXTENSION_SESSION_SECRET
        generateValue: true
      - key: MAIN_MANAGER_URL
        fromService:
          name: aacharya-tuition-manager
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PARENT_PORTAL_SECRET
        generateValue: true
      - key: INVITE_VALID_DAYS
        value: 7
      - key: COURSE_GRACE_DAYS
        value: 7
      - key: CREDENTIAL_PURGE_DAYS
        value: 30
      - key: MAX_PROOF_BYTES
        value: 5242880
    disk:
      name: parent-portal-data
      mountPath: /var/data
      sizeGB: 1
